<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Traffic & Commute AI Agent</title>
    
    <!-- Leaflet CSS for Interactive Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s ease;
            margin-top: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        .result-card {
            margin-top: 25px;
            background: rgba(15, 23, 42, 0.8);
            border-left: 5px solid #38bdf8;
            padding: 20px;
            border-radius: 8px;
            animation: fadeIn 0.5s ease-in-out;
        }
        .result-card h3 {
            margin-bottom: 12px;
            color: #38bdf8;
            font-size: 18px;
        }
        .result-card p {
            margin-bottom: 8px;
            font-size: 14px;
            line-height: 1.5;
            color: #e2e8f0;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            background: #ef4444;
            color: white;
            margin-left: 8px;
        }
        /* Map Container Styling */
        #map {
            width: 100%;
            height: 350px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Smart Commute & Traffic Agent</h1>
        <form action="/analyze" method="POST">
            <div class="form-group">
                <label for="origin">Current Location (Origin):</label>
                <input type="text" id="origin" name="origin" placeholder="e.g., PECHS Karachi" required value="{{ result.origin if result else '' }}">
            </div>
            <div class="form-group">
                <label for="destination">Destination:</label>
                <input type="text" id="destination" name="destination" placeholder="e.g., Boat Basin Karachi" required value="{{ result.destination if result else '' }}">
            </div>
            <div class="form-group">
                <label for="transport_mode">Mode of Transport:</label>
                <select id="transport_mode" name="transport_mode">
                    <option value="Car">Car</option>
                    <option value="Bike">Bike</option>
                    <option value="Public Bus">Public Bus</option>
                </select>
            </div>
            <button type="submit" id="submitBtn">Compute Optimal Route & Map</button>
        </form>

        {% if result %}
        <div class="result-card">
            <h3>🤖 Agent Intelligence & Road Route Map</h3>
            <p><strong>Route:</strong> <span id="routeOrigin">{{ result.origin }}</span> ➔ <span id="routeDest">{{ result.destination }}</span></p>
            <p><strong>Traffic Status:</strong> {{ result.traffic_status }} <span class="badge">{{ result.delay_minutes }} mins delay</span></p>
            <p><strong>Recommended Strategy:</strong><br>{{ result.route_plan | safe }}</p>
            
            <!-- Interactive Map Box -->
            <div id="map"></div>
        </div>
        {% endif %}
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        document.querySelector("form").addEventListener("submit", function() {
            const btn = document.getElementById("submitBtn");
            btn.innerText = "Analyzing Traffic & Fetching Road Map...";
            btn.style.opacity = "0.7";
        });

        {% if result %}
        window.onload = async function() {
            const originQuery = "{{ result.origin }}, Karachi";
            const destQuery = "{{ result.destination }}, Karachi";

            // Initialize Map centered on Karachi
            const map = L.map('map').setView([24.8607, 67.0011], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            async function getCoordinates(query) {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.length > 0) {
                    return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                }
                return null;
            }

            // Fetch lat/lng for origin and destination using OpenStreetMap Nominatim
            const originCoords = await getCoordinates(originQuery) || [24.8688, 67.0631]; // Fallback PECHS
            const destCoords = await getCoordinates(destQuery) || [24.8233, 67.0281];     // Fallback Boat Basin

            // Add Markers
            const originMarker = L.marker(originCoords).addTo(map).bindPopup("<b>Origin:</b> {{ result.origin }}");
            const destMarker = L.marker(destCoords).addTo(map).bindPopup("<b>Destination:</b> {{ result.destination }}");

            // Fetch actual road route from OSRM (Open Source Routing Machine) API
            const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${originCoords[1]},${originCoords[0]};${destCoords[1]},${destCoords[0]}?overview=full&geometries=geojson`;

            try {
                const res = await fetch(osrmUrl);
                const routeData = await res.json();

                if (routeData.routes && routeData.routes.length > 0) {
                    const coords = routeData.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);
                    
                    // Draw actual road path (Blue route line following roads)
                    const routeLine = L.polyline(coords, { color: '#38bdf8', weight: 6, opacity: 0.8 }).addTo(map);
                    map.fitBounds(routeLine.getBounds().pad(0.2));
                } else {
                    // Fallback to straight line if road routing fails
                    const routeLine = L.polyline([originCoords, destCoords], { color: '#38bdf8', weight: 5 }).addTo(map);
                    map.fitBounds(new L.featureGroup([originMarker, destMarker]).getBounds().pad(0.5));
                }
            } catch (error) {
                console.error("Routing error:", error);
                const routeLine = L.polyline([originCoords, destCoords], { color: '#38bdf8', weight: 5 }).addTo(map);
                map.fitBounds(new L.featureGroup([originMarker, destMarker]).getBounds().pad(0.5));
            }
        };
        {% endif %}
    </script>
</body>
</html>
